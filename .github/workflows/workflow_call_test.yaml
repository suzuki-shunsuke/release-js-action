name: test (workflow_call)
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true
jobs:
  path-filter:
    # Get changed files to filter jobs
    timeout-minutes: 10
    outputs:
      shellcheck: ${{steps.changes.outputs.shellcheck}}
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            update-aqua-checksums:
              - aqua/aqua.yaml
              - aqua/imports/*.yaml
              - aqua/aqua-checksums.json
              - .github/workflows/pull_request.yaml
              - .github/workflows/wc-update-aqua-checksums.yaml

  create-pr-branch:
    uses: ./.github/workflows/wc-create-pr-branch.yaml
    if: github.event.pull_request.user.login == 'suzuki-shunsuke'
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    with:
      version: "pr/${{github.event.pull_request.number}}"
      pr: ${{github.event.pull_request.number}}

  test-workflow:
    uses: suzuki-shunsuke/test-workflow/.github/workflows/test.yaml@0b89b9b4314282810bc944364380568708208eaa # v0.0.2
    with:
      aqua_version: v2.65.2
    permissions:
      contents: read
      pull-requests: read
