---
name: Release (workflow call)
on:
  workflow_call:
    inputs:
      version:
        description: Version
        required: true
        type: string
      pr:
        description: Pull Request Number
        required: false
        type: string
      is_comment:
        description: If the comment is posted
        required: false
        default: false
        type: boolean
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true
jobs:
  # Install npm packages through Takumi Guard, which requires id-token: write.
  # The create-pr-branch job must not have id-token: write.
  npm:
    uses: suzuki-shunsuke/download-npm-package-action/.github/workflows/download.yaml@cd93d0e45a1804793f6daaf4c24bf55ccf12f494 # v0.0.4
    permissions:
      contents: read
      id-token: write
    with:
      # The head commit of the pull request, which the create-pr-branch job checks out by gh pr checkout
      ref: ${{inputs.pr != '' && format('refs/pull/{0}/head', inputs.pr) || ''}}
      working_directory: js
      artifact_name: node_modules-create-pr-branch
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  create-pr-branch:
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    needs: npm
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh pr checkout "$PR"
        if: inputs.pr != ''
        env:
          GITHUB_TOKEN: ${{github.token}}
          PR: ${{inputs.pr}}
      # Fail if the pull request was updated after node_modules was installed
      - run: test "$(git rev-parse HEAD)" = "$SHA"
        env:
          SHA: ${{needs.npm.outputs.sha}}
      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: suzuki-shunsuke/download-npm-package-action/restore@v0.0.4
        with:
          working_directory: js
          artifact_name: node_modules-create-pr-branch
      - run: npm run build
        working-directory: js

      # Pull requests from forks can't push branches, so only build them
      - if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: ./js
        with:
          version: ${{inputs.version}}
          pr: ${{inputs.pr}}
          is_comment: ${{inputs.is_comment}}
        env:
          AQUA_CONFIG: ${{github.workspace}}/aqua/aqua.yaml
          GH_COMMENT_CONFIG: ${{github.workspace}}/github-comment.yaml
