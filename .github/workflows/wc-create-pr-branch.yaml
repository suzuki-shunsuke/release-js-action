---
name: Release (workflow call)
on:
  workflow_call:
    inputs:
      version:
        description: Version
        required: true
        type: string
      pr:
        description: Pull Request Number
        required: false
        type: string
      is_comment:
        description: If the comment is posted
        required: false
        default: false
        type: boolean
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true
jobs:
  # Install npm packages through Takumi Guard, which requires id-token: write.
  # The create-pr-branch job runs code of the repository and its dependencies with contents: write,
  # so it must not have id-token: write.
  # node_modules is passed to the create-pr-branch job via an artifact.
  jsmodule:
    uses: suzuki-shunsuke/download-npm-package-action/.github/workflows/download.yaml@ebbf371f6e38b49824a73f8c6680e2e1f83db2e8 # v0.0.1
    permissions:
      contents: read
      id-token: write
    with:
      # Release the merge commit of the pull request, the same as suzuki-shunsuke/js-action-release-workflow
      ref: ${{inputs.pr != '' && format('refs/pull/{0}/merge', inputs.pr) || ''}}
      working_directory: js
      artifact_name: node_modules-create-pr-branch
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  create-pr-branch:
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    needs: jsmodule
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Checkout the commit where npm packages were installed
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{needs.jsmodule.outputs.sha}}
          persist-credentials: false
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: suzuki-shunsuke/download-npm-package-action/restore@ebbf371f6e38b49824a73f8c6680e2e1f83db2e8 # v0.0.1
        with:
          working_directory: js
          artifact_name: node_modules-create-pr-branch
      - run: npm run build
        working-directory: js

      # Pull requests from forks can't push branches, so only build them
      - if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: ./js
        with:
          version: ${{inputs.version}}
          pr: ${{inputs.pr}}
          is_comment: ${{inputs.is_comment}}
        env:
          AQUA_CONFIG: ${{github.workspace}}/aqua/aqua.yaml
          GH_COMMENT_CONFIG: ${{github.workspace}}/github-comment.yaml
